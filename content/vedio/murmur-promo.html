<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>murmur — say it, and it exists</title>
<style>
:root{
  --bg:#0b0907; --cream:#f3e9d8; --dim:#8d8374; --amber:#ffb04a;
  --sans:Inter,"SF Pro Display","Segoe UI Variable Display","Segoe UI","Helvetica Neue",Arial,"Microsoft YaHei","PingFang SC",sans-serif;
  --mono:"JetBrains Mono","Cascadia Mono","SF Mono",Menlo,Consolas,"Courier New",monospace;
}
html,body{margin:0;height:100%;background:#000;overflow:hidden}
#vp{position:fixed;inset:0;background:#000}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0;overflow:hidden;background:var(--bg);font-family:var(--sans);color:var(--cream)}
#bg{position:absolute;left:0;top:0}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse 75% 70% at 50% 50%,rgba(0,0,0,0) 45%,rgba(0,0,0,.55) 100%)}
#fade{position:absolute;inset:0;background:#000;pointer-events:none;opacity:0}
.abs{position:absolute;left:0;top:0}

/* terminal */
#term{position:absolute;left:460px;top:476px;width:1000px;height:128px;box-sizing:border-box;border-radius:26px;overflow:hidden;
  background:linear-gradient(180deg,#171411,#12100d);border:1px solid rgba(255,236,210,.10);
  box-shadow:0 60px 140px -40px rgba(0,0,0,.9),0 0 0 1px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,240,220,.06)}
#term .chev{position:absolute;left:34px;top:46px;width:16px;height:26px}
#cmd{position:absolute;left:84px;top:36px;font:500 30px/56px var(--mono);white-space:pre;color:var(--cream)}
#cmd .a{color:var(--amber)}
.ln{position:absolute;left:0;right:0;height:56px;font:400 26px/56px var(--mono);color:rgba(243,233,216,.88);white-space:pre}
.ln .tx{position:absolute;left:80px;top:0}
.ln .mt{position:absolute;right:40px;top:0;color:var(--dim);font-size:22px}
.ln svg{position:absolute;left:36px;top:17px;width:22px;height:22px}
#blk{position:absolute;left:0;top:0;background:var(--amber);will-change:transform}

/* weather app */
#cellA{position:absolute;left:470px;top:230px;width:980px;height:620px}
#app{position:absolute;left:0;top:0;width:980px;height:620px;overflow:hidden;border-radius:34px;background:var(--amber);
  font-family:var(--sans);color:#fff}
#app > *{position:absolute}
#sun{left:-70px;top:-70px;width:140px;height:140px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,#fffbe8 0 38%,#ffe9a8 52%,rgba(255,225,150,0) 71%)}
#hello1{left:58px;top:50px;font-size:27px;font-weight:500;letter-spacing:.01em;opacity:.0}
#hello2{left:56px;top:78px;font-size:68px;font-weight:650;letter-spacing:-.025em;line-height:1.05}
#place{left:58px;top:168px;font:500 19px/1 var(--mono);letter-spacing:.02em;padding:9px 16px;border-radius:99px;background:rgba(255,255,255,.2)}
#temp{left:44px;top:214px;font-size:236px;font-weight:200;line-height:1;letter-spacing:-.05em;white-space:nowrap}
#chips{left:58px;top:462px;white-space:nowrap}
#chips span{display:inline-block;margin-right:12px;font-size:21px;font-weight:550;padding:10px 20px;border-radius:99px;background:rgba(255,255,255,.22)}
#hours{left:646px;top:46px;width:288px;height:396px;border-radius:26px;background:rgba(255,255,255,.2);overflow:hidden}
.hr{position:absolute;left:0;right:0;height:60px;font-size:22px;font-weight:550}
.hr .hl{position:absolute;inset:4px 10px;border-radius:16px;background:rgba(255,255,255,.4)}
.hr .tm{position:absolute;left:26px;top:0;line-height:60px;font-family:var(--mono);font-size:20px;opacity:.85}
.hr .br{position:absolute;left:92px;top:26px;height:8px;border-radius:8px;background:currentColor;opacity:.7}
.hr .tp{position:absolute;right:26px;top:0;line-height:60px}
#scrub{left:56px;top:536px;width:868px;height:60px}
#scrub .trk{position:absolute;left:0;top:27px;width:868px;height:6px;border-radius:6px;background:rgba(255,255,255,.28)}
#scrub .fil{position:absolute;left:0;top:27px;height:6px;border-radius:6px;background:currentColor;opacity:.9}
#scrub .hdl{position:absolute;top:12px;width:36px;height:36px;margin-left:-18px;border-radius:50%;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.28)}
#scrub .tmr{position:absolute;top:-34px;font:600 19px/1 var(--mono);margin-left:-40px;width:80px;text-align:center}
#ground{left:0;top:470px;width:980px;height:150px;background:linear-gradient(180deg,rgba(0,0,0,0),rgba(30,10,40,.16))}
#applab,.cell .lab{position:absolute;left:0;top:650px;width:980px;text-align:center;font:500 34px/1 var(--mono);color:var(--cream);opacity:.0;white-space:nowrap}

/* wall */
.cell{position:absolute;width:980px;height:620px;transform-origin:50% 50%}
.tile{position:absolute;left:0;top:0;width:980px;height:620px;border-radius:34px;overflow:hidden;box-shadow:0 40px 90px -30px rgba(0,0,0,.7)}
.tile > *{position:absolute}
.tile .nm{left:48px;top:40px;font-size:34px;font-weight:650;letter-spacing:-.02em}
.tile .sb{right:48px;top:48px;font:500 20px/1 var(--mono);opacity:.6}

/* words */
.w{position:absolute;white-space:nowrap;line-height:1;font-family:var(--sans)}
#tag{font-size:48px;font-weight:500;letter-spacing:-.01em;color:var(--cream)}
#tag2{font-size:30px;font-weight:400;letter-spacing:.12em;color:var(--dim)}
#inst{position:absolute;left:660px;top:872px;width:600px;height:88px;box-sizing:border-box;border-radius:24px;background:#16130f;border:1px solid rgba(255,236,210,.12);
  box-shadow:0 30px 80px -30px rgba(0,0,0,.8)}
#inst .chev{position:absolute;left:30px;top:30px;width:14px;height:24px}
#instT{position:absolute;left:68px;top:0;font:500 28px/88px var(--mono);white-space:pre;color:var(--cream)}
#instC{position:absolute;top:28px;width:14px;height:32px;border-radius:3px;background:var(--amber)}

/* cursor */
#cur{position:absolute;left:0;top:0;width:34px;height:44px;filter:drop-shadow(0 4px 8px rgba(0,0,0,.35))}

/* controls */
#bar{position:fixed;left:0;right:0;bottom:0;height:22px;cursor:pointer;opacity:0;transition:opacity .25s}
#vp:hover #bar{opacity:1}
#bar i{position:absolute;left:0;bottom:0;height:4px;width:0;background:var(--amber)}
#bar b{position:absolute;left:0;right:0;bottom:0;height:4px;background:rgba(255,255,255,.12)}
#hint{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);font:500 13px/1 var(--mono);color:rgba(255,255,255,.4);opacity:0;transition:opacity .25s;pointer-events:none;white-space:nowrap}
#vp:hover #hint{opacity:1}
#snd{position:fixed;left:50%;top:26px;transform:translateX(-50%);font:500 14px/1 var(--mono);letter-spacing:.04em;color:rgba(243,233,216,.85);background:rgba(20,16,12,.72);border:1px solid rgba(255,176,74,.35);padding:10px 18px;border-radius:99px;pointer-events:none;animation:pulse 1.8s ease-in-out infinite;white-space:nowrap;transition:opacity .4s}
#snd.on{animation:none;opacity:0;transition:opacity 1.2s 1.6s}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}

/* screen-recording mode — H hides all chrome */
body.noui #bar,body.noui #hint,body.noui #snd{display:none}
body.noui{cursor:none}
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%);z-index:9;font:500 13px/1 var(--mono);color:rgba(243,233,216,.9);
  background:rgba(20,16,12,.8);border:1px solid rgba(255,176,74,.3);padding:11px 18px;border-radius:99px;pointer-events:none;white-space:nowrap;opacity:0;transition:opacity .35s}
#toast.on{opacity:1}
</style>
</head>

 </div>

const q=new URLSearchParams(location.search);

  const osc=(type,f,t,dur)=>{const o=oc.createOscillator();o.type=type;o.frequency.value=f;o.start(t);o.stop(t+dur);return o;};
  const noise=(t,dur)=>{const s=oc.createBufferSource();s.buffer=nb;s.loop=true;s.start(t,r()*1.5);s.stop(t+dur);return s;};
  const route=(n,{d=1,s=0,e=0}={})=>{if(d){const g=oc.createGain();g.gain.value=d;n.connect(g);g.connect(dry);}if(s){const g=oc.createGain();g.gain.value=s;n.connect(g);g.connect(send);}if(e){const g=oc.createGain();g.gain.value=e;n.connect(g);g.connect(dsend);}};

  // ── voices ──
  const kick=(t,v=1)=>{const o=osc('sine',160,t,.5),g=oc.createGain();o.frequency.setValueAtTime(165,t);o.frequency.exponentialRampToValueAtTime(46,t+.11);env(g,t,.002,.95*v,.02,.34);o.connect(g);route(g);
    const n=noise(t,.02),h=oc.createBiquadFilter();h.type='highpass';h.frequency.value=2500;const ng=oc.createGain();env(ng,t,.001,.12*v,0,.015);n.connect(h);h.connect(ng);route(ng);};
  const sub=(t,m,dur,v=.5)=>{const o=osc('sine',mf(m),t,dur+1.2),g=oc.createGain();env(g,t,.03,v,dur,1.1);o.connect(g);route(g,{d:1,s:.1});};
  const clap=(t,v=1)=>{[0,.011,.023].forEach((o,i)=>{const n=noise(t+o,.25),f=oc.createBiquadFilter();f.type='bandpass';f.frequency.value=1700;f.Q.value=.9;const g=oc.createGain();
      if(i<2)env(g,t+o,.001,.22*v,0,.012);else env(g,t+o,.001,.3*v,.004,.2);n.connect(f);f.connect(g);route(g,{d:1,s:.35});});
    const b=osc('triangle',190,t,.15),bg=oc.createGain();env(bg,t,.002,.1*v,0,.09);b.connect(bg);route(bg);};
  const hat=(t,v=1,open=false)=>{const n=noise(t,.3),f=oc.createBiquadFilter();f.type='highpass';f.frequency.value=7200;const g=oc.createGain();env(g,t,.001,.1*v,0,open?.16:.035);n.connect(f);f.connect(g);route(g,{d:1,s:.12});};
  const pluck=(t,m,v=1,len=.38)=>{const g=oc.createGain(),f=oc.createBiquadFilter();f.type='lowpass';f.Q.value=2;f.frequency.setValueAtTime(3800,t);f.frequency.exponentialRampToValueAtTime(520,t+len*.8);
    const a=osc('triangle',mf(m),t,len+.3),b=osc('square',mf(m)*1.003,t,len+.3),bg=oc.createGain();bg.gain.value=.25;a.connect(f);b.connect(bg);bg.connect(f);f.connect(g);env(g,t,.004,.3*v,0,len);route(g,{d:1,s:.4,e:.35});};
  const bass=(t,m,dur,v=1)=>{const f=oc.createBiquadFilter();f.type='lowpass';f.frequency.value=420;f.Q.value=1.2;const g=oc.createGain();
    const a=osc('sawtooth',mf(m),t,dur+.2),b=osc('sine',mf(m),t,dur+.2),bg=oc.createGain();bg.gain.value=.9;a.connect(f);b.connect(bg);bg.connect(g);f.connect(g);env(g,t,.008,.34*v,dur*.6,dur*.4);route(g);};
  const pad=(t,notes,dur,v=.06,att=.7)=>{notes.forEach(m=>{[-8,8].forEach(dt=>{const o=osc('sawtooth',mf(m),t,dur+att+1.4);o.detune.value=dt;const f=oc.createBiquadFilter();f.type='lowpass';f.frequency.setValueAtTime(500,t);f.frequency.linearRampToValueAtTime(1700,t+dur*.6);
      const g=oc.createGain();env(g,t,att,v/Math.sqrt(notes.length*2)*2,dur-att*.3,1.3);o.connect(f);f.connect(g);route(g,{d:.7,s:.7});});});};
  const stab=(t,notes,v=1,len=.22)=>{notes.forEach(m=>{const o=osc('sawtooth',mf(m),t,len+.4),o2=osc('square',mf(m)*.998,t,len+.4),f=oc.createBiquadFilter();f.type='lowpass';f.Q.value=1.5;
      f.frequency.setValueAtTime(3400,t);f.frequency.exponentialRampToValueAtTime(600,t+len);const g=oc.createGain();env(g,t,.003,.1*v,.02,len);o.connect(f);o2.connect(f);f.connect(g);route(g,{d:1,s:.4});});};
  const riser=(t0_,t1_,v=.2)=>{const n=noise(t0_,t1_-t0_+.05),f=oc.createBiquadFilter();f.type='bandpass';f.Q.value=1.6;f.frequency.setValueAtTime(380,t0_);f.frequency.exponentialRampToValueAtTime(7500,t1_);
    const g=oc.createGain();g.gain.setValueAtTime(LO,t0_);g.gain.exponentialRampToValueAtTime(v,t1_);g.gain.setValueAtTime(LO,t1_+.02);n.connect(f);f.connect(g);route(g,{d:1,s:.3});};
  const crash=(t,v=.5,len=1.6)=>{const n=noise(t,len+.2),f=oc.createBiquadFilter();f.type='highpass';f.frequency.value=3200;const g=oc.createGain();env(g,t,.002,.2*v,.02,len);n.connect(f);f.connect(g);route(g,{d:.8,s:.5});};
  const key=(t,i,sp)=>{const n=noise(t,.05),f=oc.createBiquadFilter();f.type='bandpass';f.frequency.value=sp?900:2200+(i%5)*260;f.Q.value=2.2;const g=oc.createGain();env(g,t,.0008,.07,0,.022);n.connect(f);f.connect(g);route(g,{d:1,s:.1});
    const o=osc('sine',sp?180:420+(i%4)*40,t,.05),og=oc.createGain();env(og,t,.001,.035,0,.03);o.connect(og);route(og,{d:1});};
  const bubble=(t,m,v=.08)=>{const o=osc('sine',mf(m),t,.3),g=oc.createGain();o.frequency.setValueAtTime(mf(m)*.9,t);o.frequency.exponentialRampToValueAtTime(mf(m),t+.05);env(g,t,.004,v,0,.22);o.connect(g);route(g,{d:.7,s:.6,e:.4});};

  // ── the score ──
  const E=.34, BAR=8*E, G0=MORPH0, END_GROOVE=12.6;
  const CH=[{b:45,n:[57,60,64,67]},{b:41,n:[57,60,65,69]},{b:48,n:[60,64,67,71]},{b:43,n:[59,62,67,71]}];
  // 0 – 4: room tone and a person typing
  pad(.3,[45,52,57,60],5.4,.05,1.8);
  charT.forEach((ct,i)=>key(ct,i,CMD[i]===' '));
  // 4 – 5.6: enter, four hops, the lift into the window
  kick(ENTER,.55);sub(ENTER,33,.5,.42);
  [69,72,76,79].forEach((m,i)=>pluck(D[i],m,.8+.1*i,.3));
  for(let k=0,t=4.9;t<MORPH0-.02;k++,t+=E/2)hat(t,.35+k*.22);
  riser(4.95,MORPH0,.24);
  // 5.62: the window blooms
  kick(MORPH0,1.1);sub(MORPH0,33,1.8,.6);clap(MORPH0,.7);crash(MORPH0,.35,1.1);
  stab(MORPH0,[57,64,69,72],.7,.5);
  // groove
  for(let bar=0;;bar++){
    const tb=G0+bar*BAR;if(tb>=END_GROOVE)break;const ch=CH[bar%4];
    pad(tb,ch.n.map(m=>m-12),Math.min(BAR,END_GROOVE-tb),.1,.5);
    for(let j=0;j<8;j++){
      const t=tb+j*E;if(t>=END_GROOVE-.05)break;
      const short=bar>=2;
      if(!short?[0,3,4].includes(j):[0,4].includes(j))if(!(bar===0&&j===0))kick(t,.95);
      if(!short&&t>=7.2&&(j===2||j===6))clap(t,.75);
      if(!short||j%2===0)hat(t,j%2?.7:.45);
      if(bar===1&&j===7)hat(t,.8,true);
      if(j===0)bass(t,ch.b,E*3.6,1);
      if(!short&&(j===3||j===5))bass(t,ch.b+12,E*.8,.7);
      if((t>=6.35&&!short)||(short&&j<4)){const pat=[0,2,1,3,2,1,3,2][j];pluck(t,ch.n[pat]+(bar===1?12:0),.6+(j%2?0:.2),.34);}
    }
  }
  // pull-out: a sweep as the camera leaves, then the wall appears as bubbles
  riser(PULL0-.2,PULL0+.55,.2);crash(PULL0+.55,.25,.8);
  const PENT=[72,74,76,79,81,84,86];
  cells.filter((c,i)=>i%3===0).forEach((c,i)=>bubble(c.popT,PENT[i%PENT.length],.07));
  // the scrub: a tone that follows the handle
  {const o=osc('sine',440,DRAG0,DRAG1-DRAG0+.3),g=oc.createGain();for(let k=0;k<=24;k++){const tt=DRAG0+(DRAG1-DRAG0)*k/24;o.frequency.setValueAtTime(mf(60)*Math.pow(2,2*ease.cubicInOut(k/24)),tt);}
    env(g,DRAG0,.06,.045,DRAG1-DRAG0-.1,.25);o.connect(g);route(g,{d:.6,s:.8,e:.5});}
  // 12.6 – 13.5: nearly nothing
  sub(END_GROOVE,31,1.0,.14);
  // gather: a roll that accelerates, then the seal
  riser(GATHER0,GATHER1,.3);
  for(let k=0;k<10;k++){const u=k/9;clap(GATHER0+.88*(1-Math.pow(1-u,1.9)),.25+.4*u);}
  {const o=osc('sine',55,GATHER0,1),g=oc.createGain();o.frequency.setValueAtTime(55,GATHER0);o.frequency.exponentialRampToValueAtTime(220,GATHER1);env(g,GATHER0,.3,.2,.5,.05);o.connect(g);route(g,{d:.8,s:.4});}
  kick(GATHER1,1.2);sub(GATHER1,33,.9,.8);crash(GATHER1,.5,1.0);
  // staccato: three stabs, each with its own kick, and air between them
  [[57,60,64,69],[57,60,65,69],[55,59,62,67]].forEach((nn,i)=>{const t=WORDS[i][0];kick(t,1);stab(t,nn,.9,.2);sub(t,[33,29,31][i],.2,.5);});
  // wordmark
  kick(WM,1.1);sub(WM,36,3.4,.55);pad(WM,[60,64,67,71,74],4.5,.1,.5);crash(WM,.3,1.2);
  [72,76,79,83,86,88].forEach((m,i)=>pluck(WM+.05+i*.06,m,.55+.07*i,.7));
  pluck(WM+.34,91,.5,1.2);
  // tagline + the second prompt
  pluck(TAG,79,.5,.9);pluck(TAG+.22,76,.4,.9);
  riser(INST-.1,INST+.25,.07);
  instCharT.forEach((ct,i)=>key(ct,i,INSTX[i]===' '));
  {const te=instCharT[instCharT.length-1]+.35;kick(te,.6);sub(te,36,1.2,.4);[72,76,79,83,86].forEach((m,i)=>pluck(te+.04+i*.09,m,.45,1.0));pad(te,[60,64,67,71,74],3,.07,.6);}
  // fade with the picture
  master.gain.setValueAtTime(.9,DUR-.7);master.gain.linearRampToValueAtTime(0,DUR-.05);

  const buf=await oc.startRendering();
  let pk=0;for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++)pk=Math.max(pk,Math.abs(d[i]));}
  const k=pk>0?.8/pk:1;for(let c=0;c<2;c++){const d=buf.getChannelData(c);for(let i=0;i<d.length;i++)d[i]*=k;}
  return buf;
}
function sync(){
  try{asrc&&asrc.stop();}catch(e){}asrc=null;
  if(!soundOn||paused||!abuf||!actx)return;
  asrc=actx.createBufferSource();asrc.buffer=abuf;asrc.connect(again);asrc.start(0,clamp(cur,0,abuf.duration-.05));
}
function enableSound(){
  if(soundOn||PIN)return false;
  actx=new (window.AudioContext||window.webkitAudioContext)();again=actx.createGain();again.gain.value=muted?0:1;again.connect(actx.destination);
  actx.resume();soundOn=true;$('snd').classList.add('on');setT(0);paused=false;sync();return true;
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden){t0=performance.now()-cur*1000;sync();}});
const setT=v=>{cur=clamp(v,0,DUR);t0=performance.now()-cur*1000;sync();};
const togglePause=()=>{paused=!paused;if(!paused)t0=performance.now()-cur*1000;sync();};
$('vp').addEventListener('click',e=>{if(e.target.closest('#bar'))return;if(enableSound())return;togglePause();});
$('bar').addEventListener('click',e=>{setT(e.clientX/innerWidth*DUR);});
addEventListener('keydown',e=>{
  if(e.key==='m'||e.key==='M'){if(!soundOn){enableSound();return;}muted=!muted;again.gain.value=muted?0:1;$('snd').textContent=muted?'♪ muted · M':'♪ sound on · M to mute';$('snd').classList.remove('on');$('snd').style.animation='none';$('snd').style.opacity=1;clearTimeout(window.__sndT);window.__sndT=setTimeout(()=>{$('snd').style.opacity=0;},1500);}
  else if(e.key==='r'||e.key==='R'){setT(0);paused=false;sync();}
  else if(e.key==='ArrowRight')setT(cur+2);else if(e.key==='ArrowLeft')setT(cur-2);
  else if(e.key===' '){e.preventDefault();if(!soundOn){enableSound();return;}togglePause();}
  else if(e.key==='h'||e.key==='H'){
    const hidden=document.body.classList.toggle('noui');
    const t=$('toast');t.textContent=hidden?'UI hidden · H to show':'UI shown · H to hide';
    t.classList.add('on');clearTimeout(window.__uiT);window.__uiT=setTimeout(()=>t.classList.remove('on'),1400);
  }
});
window.__seek=t=>{seek(t);};window.__meta={dur:DUR,fps:60,w:W,h:H};
start();
})();
</script>
