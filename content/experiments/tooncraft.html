/* ------------------------------ character update ------------------------------ */
const _forward = new THREE.Vector3();
const _right = new THREE.Vector3();
const _moveTarget = new THREE.Vector3();
const _aim = new THREE.Vector3();
const _offset = new THREE.Vector3();
const UP = new THREE.Vector3(0, 1, 0);

function updateCharacter(dt, time) {
  let forwardInput = 0, sideInput = 0;
  forwardInput = (keys.has('KeyW') || keys.has('ArrowUp') ? 1 : 0) - (keys.has('KeyS') || keys.has('ArrowDown') ? 1 : 0);
  sideInput = (keys.has('KeyD') || keys.has('ArrowRight') ? 1 : 0) - (keys.has('KeyA') || keys.has('ArrowLeft') ? 1 : 0);
  /* virtual joystick (touch) blends with the keyboard */
  if (touchStick.active) {
    forwardInput += -touchStick.y;
    sideInput += touchStick.x;
  }
  forwardInput = clamp(forwardInput, -1, 1);
  sideInput = clamp(sideInput, -1, 1);
  _moveTarget.set(0, 0, 0);
  if (forwardInput !== 0 || sideInput !== 0) {
    _forward.copy(camState.target).sub(camera.position);
    _forward.y = 0;
    _forward.normalize();
    _right.crossVectors(_forward, UP).normalize();
    _moveTarget.addScaledVector(_forward, forwardInput).addScaledVector(_right, sideInput);
    _moveTarget.normalize().multiplyScalar(7.4);
  }
  char.vel.lerp(_moveTarget, 1 - Math.exp(-dt * 10));
  char.pos.x += char.vel.x * dt;
  char.pos.z += char.vel.z * dt;
  if (state.worldMode !== 'open') {
    const limit = HALF - 1.9;
    char.pos.x = clamp(char.pos.x, -limit, limit);
    char.pos.z = clamp(char.pos.z, -limit, limit);
  }

  const ground = sampleHeight(displayHeights, char.pos.x, char.pos.z);
  char.inWater = ground < WATER_Y - 0.08;
  const standY = char.inWater ? WATER_Y - 0.52 : ground;

  /* jump with a small clay-figure arc */
  if (char.grounded) {
    char.pos.y = damp(char.pos.y, standY, 15, dt);
    if (char.jumpRequested) {
      char.jumpVel = 8.2;
      char.grounded = false;
      char.pos.y += 0.025;
    }
  } else {
    char.jumpVel -= 24 * dt;
    char.pos.y += char.jumpVel * dt;
    if (char.pos.y <= standY) {
      char.pos.y = standY;
      char.jumpVel = 0;
      char.grounded = true;
    }
  }
  char.jumpRequested = false;

  const speed = char.vel.length();
  const moveAmp = clamp(speed / 6.5, 0, 1);
  char.amp = damp(char.amp, moveAmp, 9, dt);
  char.walkPhase += dt * (3.6 + speed * 1.55);

  if (speed > 0.22) {
    const desiredYaw = Math.atan2(char.vel.x, char.vel.z);
    let diff = ((desiredYaw - char.yaw + Math.PI) % TAU + TAU) % TAU - Math.PI;
    char.yaw += diff * (1 - Math.exp(-dt * 13));
  }

  const bob = char.grounded
    ? Math.abs(Math.sin(char.walkPhase)) * 0.05 * char.amp + Math.sin(time * 2.0) * 0.008
    : 0;
  avatar.position.set(char.pos.x, char.pos.y + (char.inWater && char.grounded ? Math.sin(time * 2.4) * 0.035 : 0), char.pos.z);
  avatar.rotation.y = char.yaw;
  avatarVisual.position.y = bob;
  avatarVisual.rotation.x = damp(avatarVisual.rotation.x, char.amp * 0.055 + (char.grounded ? 0 : 0.08), 7, dt);

  const swing = Math.sin(char.walkPhase) * 0.65 * char.amp;
  if (char.grounded) {
    charParts.legL.rotation.x = swing;
    charParts.legR.rotation.x = -swing;
    charParts.armL.rotation.x = -swing * 0.8;
    charParts.armR.rotation.x = swing * 0.8;
  } else {
    charParts.legL.rotation.x = damp(charParts.legL.rotation.x, 0.5, 10, dt);
    charParts.legR.rotation.x = damp(charParts.legR.rotation.x, -0.25, 10, dt);
    charParts.armL.rotation.x = damp(charParts.armL.rotation.x, -0.75, 10, dt);
    charParts.armR.rotation.x = damp(charParts.armR.rotation.x, -0.75, 10, dt);
  }
  const waterArm = char.inWater ? 0.36 : 0;
  charParts.armL.rotation.z = 0.16 + waterArm + (char.grounded ? Math.sin(time * 2.1) * 0.015 : 0.28);
  charParts.armR.rotation.z = -0.16 - waterArm - (char.grounded ? Math.sin(time * 2.1) * 0.015 : 0.28);
}

/* ------------------------------ camera update ------------------------------ */
function updateCamera(dt, snap = false) {
  camState.orbitPause = Math.max(0, camState.orbitPause - dt);
  if (state.cameraMode === 'orbit' && camState.orbitPause <= 0) camState.az += dt * 0.16;
  _aim.set(char.pos.x + char.vel.x * 0.16, char.pos.y + 0.9, char.pos.z + char.vel.z * 0.16);
  if (snap) camState.target.copy(_aim);
  else camState.target.lerp(_aim, 1 - Math.exp(-dt * 4.8));
  _offset.set(
    Math.cos(camState.az) * Math.cos(camState.el),
    Math.sin(camState.el),
    Math.sin(camState.az) * Math.cos(camState.el)
  ).multiplyScalar(camState.dist);
  camera.position.copy(camState.target).add(_offset);
  camera.lookAt(camState.target);
}

/* ------------------------------ sculpt cursor + raycasting ------------------------------ */
const raycaster = new THREE.Raycaster();
const pointerNDC = new THREE.Vector2();
const pointer = {
  inside: false, stroke: 0, pid: null, dirty: false,
  type: null, touch: false, dir: 1,
  downX: 0, downY: 0, lastX: 0, lastY: 0,

const hover = { valid: false, point: new THREE.Vector3(), normal: new THREE.Vector3(0, 1, 0) };
const Z_AXIS = new THREE.Vector3(0, 0, 1);

/* touch input tuning */
const TOUCH_LIFT = 46;          // raycast above the fingertip so the ring stays visible
const TOUCH_SLOP = 9;           // px of travel before a touch drag turns into a sculpt stroke
let touchBrush = 1;             // touch brush direction: 1 = raise, -1 = lower (toggle button)
const touchStick = { x: 0, y: 0, active: false, pid: null };
const activePointers = new Map();
let pinchState = null;
let gestureLock = false;

function isTouchPrimary() {
  return window.matchMedia('(pointer: coarse)').matches || window.matchMedia('(hover: none)').matches;
}
function vibrate(ms) {
  if (!navigator.vibrate) return;
  try { navigator.vibrate(ms); } catch (_) { /* noop */ }
}

let ringGroup, ringColorMat;
function createRing() {
  ringGroup = new THREE.Group();
  ringGroup.visible = false;
  const darkMat = new THREE.MeshBasicMaterial({
    color: 0x17121d, transparent: true, opacity: 0.42, side: THREE.DoubleSide, depthWrite: false, toneMapped: false,
  });
  ringColorMat = new THREE.MeshBasicMaterial({
    color: 0xffd63f, transparent: true, opacity: 0.62, side: THREE.DoubleSide, depthWrite: false, toneMapped: false,
  });
  const dotMat = new THREE.MeshBasicMaterial({
    color: 0xffffff, transparent: true, opacity: 0.7, side: THREE.DoubleSide, depthWrite: false, toneMapped: false,
  });
  const outer = new THREE.Mesh(new THREE.RingGeometry(2.34, 2.58, 64), darkMat);
  const inner = new THREE.Mesh(new THREE.RingGeometry(1.98, 2.3, 64), ringColorMat);
  const dot = new THREE.Mesh(new THREE.RingGeometry(0.16, 0.28, 28), dotMat);
  for (const mesh of [outer, inner, dot]) {
    mesh.renderOrder = 8;
    ringGroup.add(mesh);
  }
  scene.add(ringGroup);
}

function updatePointerFromEvent(e) {
  const rect = renderer.domElement.getBoundingClientRect();
  const lift = pointer.touch ? TOUCH_LIFT : 0;
  pointerNDC.set(
    ((e.clientX - rect.left) / rect.width) * 2 - 1,
    -((e.clientY - rect.top - lift) / rect.height) * 2 + 1
  );
  pointer.dirty = true;
}

function updateHover(force = false) {
  if (!state.editMode || !pointer.inside) {
    hover.valid = false;
    ringGroup.visible = false;
    return false;
  }
  // a live sculpt brush is re-cast every frame: the mesh is moving under it
  if (!force && !pointer.dirty && !pointer.stroke) return hover.valid;
  pointer.dirty = false;
  raycaster.setFromCamera(pointerNDC, camera);
  const hits = raycaster.intersectObject(terrainMesh, false);
  if (!hits.length) {
    hover.valid = false;
    ringGroup.visible = false;
    return false;
  }
  const hit = hits[0];
  hover.point.copy(hit.point);
  if (hit.face) hover.normal.copy(hit.face.normal);
  else hover.normal.set(0, 1, 0);
  hover.normal.normalize();
  hover.valid = true;
  return true;
}

function updateRing(time) {
  if (!state.editMode || !hover.valid) {
    ringGroup.visible = false;
    return;
  }
  ringGroup.visible = true;
  ringGroup.position.copy(hover.point).addScaledVector(hover.normal, 0.14);
  ringGroup.quaternion.setFromUnitVectors(Z_AXIS, hover.normal);
  const pulse = 1 + Math.sin(time * 4.3) * 0.04;
  ringGroup.scale.setScalar(pulse);
  const lower = pointer.stroke < 0 || (!pointer.stroke && pointer.touch && touchBrush < 0);
  ringColorMat.color.set(lower ? 0x79e8cf : 0xffd63f);
  ringColorMat.opacity = 0.56 + Math.sin(time * 4.3) * 0.1;
}

/* ---- sculpt / orbit / pinch gesture handling ---- */
function releaseCanvasCapture() {
  const canvas = renderer.domElement;
  if (pointer.pid === null) return;
  try {
    if (canvas.hasPointerCapture(pointer.pid)) canvas.releasePointerCapture(pointer.pid);
  } catch (_) { /* noop */ }
}
function cancelGesture() {
  releaseCanvasCapture();
  pointer.stroke = 0;
  pointer.pid = null;
  pointer.type = null;
  pointer.dirty = true;
  document.body.classList.remove('dragging');
  if (pointer.touch) {
    pointer.inside = false;
    hover.valid = false;
    if (ringGroup) ringGroup.visible = false;
  }
}
function endStroke() { cancelGesture(); }

/* begin raising at the current hover point */
function startSculpt(direction) {
  if (!hover.valid) return false;
  pointer.stroke = direction;
  pointer.type = 'sculpt';
  applyBrush(hover.point.x, hover.point.z, direction, 0.2);
  updateHover(true);
  return true;
}

function startPinch() {
  const ids = [...activePointers.keys()];
  if (ids.length < 2) return;
  const a = activePointers.get(ids[0]);
  const b = activePointers.get(ids[1]);
  pinchState = {
    idA: ids[0], idB: ids[1],
    dist: Math.max(1, Math.hypot(a.x - b.x, a.y - b.y)),
    midX: (a.x + b.x) / 2,
    midY: (a.y + b.y) / 2,
    zoom: state.zoom,
    el: camState.el,
  };
  pointer.type = 'pinch';
  pointer.pid = null;
  document.body.classList.remove('dragging');
}
function updatePinch() {
  if (!pinchState) return false;
  const a = activePointers.get(pinchState.idA);
  const b = activePointers.get(pinchState.idB);
  if (!a || !b) return true;
  const dist = Math.max(1, Math.hypot(a.x - b.x, a.y - b.y));
  const midX = (a.x + b.x) / 2;
  const midY = (a.y + b.y) / 2;
  state.zoom = clamp(pinchState.zoom * (dist / pinchState.dist), 0.72, 2.1);
  camState.az += (midX - pinchState.midX) * 0.0055;
  camState.el = clamp(pinchState.el + (midY - pinchState.midY) * 0.0032, 0.32, 1.28);
  pinchState.midX = midX;
  pinchState.midY = midY;
  camState.orbitPause = 1.4;
  applyZoom();
  return true;
}

function onCanvasPointerDown(e) {
  if (e.pointerType === 'touch' && !document.body.classList.contains('is-touch')) enableTouchUI(true);
  e.preventDefault();
  try { renderer.domElement.setPointerCapture(e.pointerId); } catch (_) { /* noop */ }
  activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (activePointers.size >= 2) {
    cancelGesture();
    gestureLock = true;
    startPinch();
    return;
  }
  if (gestureLock) return;

  const touch = e.pointerType !== 'mouse';
  pointer.touch = touch;
  pointer.inside = true;
  pointer.dir = touch ? touchBrush : ((e.button === 2 || e.ctrlKey) ? -1 : 1);
  updatePointerFromEvent(e);
  updateHover(true);

  if (state.editMode) {
    if (!touch && e.button !== 0 && e.button !== 2 && !e.ctrlKey) return;
    pointer.pid = e.pointerId;
    pointer.downX = e.clientX;
    pointer.downY = e.clientY;
    pointer.type = 'sculpt';
    /* touch waits for a real drag; desktop sculpts on the button press */
    if (!touch) startSculpt(pointer.dir);
    return;
  }

  /* outside edit mode a drag orbits the camera */
  pointer.pid = e.pointerId;
  pointer.downX = pointer.lastX = e.clientX;
  pointer.downY = pointer.lastY = e.clientY;
  pointer.type = 'look';
  document.body.classList.add('dragging');
}

function onCanvasPointerMove(e) {
  if (activePointers.has(e.pointerId)) activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

  if (pinchState) { updatePinch(); return; }

  if (pointer.pid !== e.pointerId) {
    if (e.pointerType !== 'touch' && pointer.pid === null) {
      pointer.touch = false;
      pointer.inside = true;
      updatePointerFromEvent(e);
    }
    return;
  }

  if (pointer.type === 'look') {
    const dx = e.clientX - pointer.lastX;
    const dy = e.clientY - pointer.lastY;
    pointer.lastX = e.clientX;
    pointer.lastY = e.clientY;
    if (Math.abs(dx) + Math.abs(dy) < 0.01) return;
    camState.az += dx * 0.006;
    camState.el = clamp(camState.el + dy * 0.0045, 0.32, 1.28);
    camState.orbitPause = 1.4;
    return;
  }

  if (!state.editMode || pointer.type !== 'sculpt') return;

  /* touch: a short drag starts the sculpt stroke in the selected brush direction */
  if (pointer.touch && !pointer.stroke) {
    const moved = Math.hypot(e.clientX - pointer.downX, e.clientY - pointer.downY);
    updatePointerFromEvent(e);
    updateHover(true);
    if (moved >= TOUCH_SLOP) startSculpt(pointer.dir);
    return;
  }

  pointer.inside = true;
  updatePointerFromEvent(e);
  updateHover(true);
  if (!pointer.stroke && pointer.type === 'sculpt' && hover.valid) startSculpt(pointer.dir);
}

function onCanvasPointerUp(e) {
  activePointers.delete(e.pointerId);
  if (activePointers.size === 0) {
    pinchState = null;
    gestureLock = false;
    if (pointer.pid === null) pointer.type = null;
  } else if (pinchState && activePointers.size < 2) {
    pinchState = null;
  }
  if (pointer.pid !== e.pointerId) return;
  endStroke();
}

function onCanvasPointerLeave() {
  if (pointer.pid !== null) return;
  pointer.inside = false;
  hover.valid = false;
  if (ringGroup) ringGroup.visible = false;
}

/* ---- touch layout: stick + jump button ---- */
function enableTouchUI(on, announce = false) {

function stickReset() {
  touchStick.pid = null;
  touchStick.active = false;
  touchStick.x = 0;
  touchStick.y = 0;
  if (ui.stickZone) ui.stickZone.classList.remove('is-active');
  if (ui.stickKnob) {
    ui.stickKnob.style.transition = 'transform .22s cubic-bezier(.2,.9,.3,1.4)';
    ui.stickKnob.style.transform = 'translate(0px,0px)';
  }
}
function stickUpdate(e) {
  const zone = ui.stickZone;
  if (!zone) return;
  const rect = zone.getBoundingClientRect();
  const maxRadius = Math.max(24, rect.width * 0.33);
  let dx = e.clientX - (rect.left + rect.width / 2);
  let dy = e.clientY - (rect.top + rect.height / 2);
  const len = Math.hypot(dx, dy);
  if (len > maxRadius) { dx = (dx / len) * maxRadius; dy = (dy / len) * maxRadius; }
  if (ui.stickKnob) ui.stickKnob.style.transform = `translate(${dx}px,${dy}px)`;
  const nx = dx / maxRadius;
  const ny = dy / maxRadius;
  const mag = Math.min(1, Math.hypot(nx, ny));
  const dead = 0.14;
  if (mag <= dead) {
    touchStick.x = 0;
    touchStick.y = 0;
  } else {
    const scaled = (mag - dead) / (1 - dead) / mag;
    touchStick.x = nx * scaled;
    touchStick.y = ny * scaled;
  }
}
function setupTouchControls() {

      if (touchStick.pid !== e.pointerId) return;

      if (touchStick.pid === null || (e && e.pointerId !== touchStick.pid)) return;

function updateSkyAnchor() {
  sky.position.set(patchCenterX, 0, patchCenterZ);

}

function recenterPatch(nextX, nextZ) {
  patchCenterX = nextX;
  patchCenterZ = nextZ;
  terrainMesh.position.set(patchCenterX, 0, patchCenterZ);
  terrainOutlineMesh.position.set(patchCenterX, 0, patchCenterZ);
  terrainMesh.updateMatrixWorld();
  terrainOutlineMesh.updateMatrixWorld();
  waterMesh.position.set(patchCenterX, 0, patchCenterZ);
  deepWaterMesh.position.set(patchCenterX, WATER_Y - 0.55, patchCenterZ);
  updateSkyAnchor();
  const next = makePatchHeights();
  heights.set(next);
  displayHeights.set(next);
  rebuildTerrainNow(true);
  lastRecolor = performance.now();
  terrainDirty = false;
  rebuildFlora();
  recolorWater();
  rebuildFireflies();
  updateFloraMatrices();
}

function maybeRecenter() {
  if (state.worldMode !== 'open') return;
  const view = BASE_FRUSTUM / state.zoom;
  const threshold = Math.max(7, HALF - view * 1.18);
  if (Math.abs(char.pos.x - patchCenterX) <= threshold && Math.abs(char.pos.z - patchCenterZ) <= threshold) return;
  let nx = Math.round(char.pos.x / PATCH_SNAP) * PATCH_SNAP;
  let nz = Math.round(char.pos.z / PATCH_SNAP) * PATCH_SNAP;
  if (nx === patchCenterX && nz === patchCenterZ) {
    nx = patchCenterX + Math.sign(char.pos.x - patchCenterX || 1) * PATCH_SNAP;
    nz = patchCenterZ + Math.sign(char.pos.z - patchCenterZ || 1) * PATCH_SNAP;
  }
  recenterPatch(nx, nz);
}

function regenerate(initial = false) {
  edits.clear();
  removedProps.clear();
  clearFallingProps();
  supportAccumulator = 0;
  initTerrainNoise(state.seed);
  patchCenterX = 0;
  patchCenterZ = 0;
  terrainMesh.position.set(0, 0, 0);
  terrainOutlineMesh.position.set(0, 0, 0);
  waterMesh.position.set(0, 0, 0);
  deepWaterMesh.position.set(0, WATER_Y - 0.55, 0);
  updateSkyAnchor();

  const next = makePatchHeights();
  heights.set(next);
  displayHeights.set(next);
  rebuildTerrainNow(true);
  lastRecolor = performance.now();
  terrainDirty = false;
  spawnCharacter();
  rebuildFlora();
  rebuildClouds();
  recolorWater();
  rebuildFireflies();
  camState.target.set(char.pos.x, char.pos.y + 0.9, char.pos.z);
  updateCamera(0, true);
  updateFloraMatrices();
  ui.seedTag.textContent = '#' + state.seed;
  if (!initial) {

    if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) e.preventDefault();
    keys.add(e.code);

  window.addEventListener('blur', () => {
    keys.clear();
    cancelGesture();
    stickReset();
    activePointers.clear();
    pinchState = null;
    gestureLock = false;
  });

  const canvas = renderer.domElement;
  canvas.addEventListener('pointermove', onCanvasPointerMove);
  canvas.addEventListener('pointerenter', () => { if (pointer.pid === null) pointer.inside = true; });
  canvas.addEventListener('pointerleave', onCanvasPointerLeave);
  canvas.addEventListener('pointerdown', onCanvasPointerDown);
  window.addEventListener('pointerup', onCanvasPointerUp);
  window.addEventListener('pointercancel', onCanvasPointerUp);
  canvas.addEventListener('contextmenu', (e) => e.preventDefault());
  canvas.addEventListener('auxclick', (e) => e.preventDefault());
  canvas.addEventListener('mousedown', (e) => { if (e.button === 1) e.preventDefault(); });
  canvas.addEventListener('dragstart', (e) => e.preventDefault());
  canvas.addEventListener('selectstart', (e) => e.preventDefault());
  canvas.addEventListener('wheel', (e) => {
    e.preventDefault();
    state.zoom = clamp(state.zoom * (1 - e.deltaY * 0.0011), 0.72, 2.1);
    applyZoom();
  }, { passive: false });
  document.addEventListener('gesturestart', (e) => e.preventDefault(), { passive: false });

  window.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'touch') enableTouchUI(true);
  }, { passive: true, capture: true });

  setupTouchControls();
  setTouchBrush(touchBrush);
}

/* ------------------------------ view / resize ------------------------------ */
function applyZoom() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const aspect = w / Math.max(1, h);
  const halfH = BASE_FRUSTUM / state.zoom / 2;
  camera.left = -halfH * aspect;
  camera.right = halfH * aspect;
  camera.top = halfH;
  camera.bottom = -halfH;
  camera.updateProjectionMatrix();
}
function resizeView() {
  const w = window.innerWidth;
  const h = window.innerHeight;
  const touchLayout = document.body.classList.contains('is-touch');
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, touchLayout ? 1.75 : 2));
  renderer.setSize(w, h);
  applyZoom();
}
window.addEventListener('resize', resizeView);
document.addEventListener('visibilitychange', () => {
  if (document.hidden) keys.clear();
});

/* ------------------------------ main loop ------------------------------ */
const clock = new THREE.Clock();
let worldTime = 0;
let waterAccum = 0;
let ready = false;
let fpsAvg = 60;
let frameCount = 0;

function animate() {
  requestAnimationFrame(animate);
  frameCount++;
  const dt = Math.min(clock.getDelta(), 0.05);
  if (dt > 0) fpsAvg = lerp(fpsAvg, 1 / Math.max(dt, 0.0001), 0.05);
  worldTime += dt;

  if (state.autoTime) {
    state.time = (state.time + dt * 0.12) % 24;
    updateCelestial();
    syncTimeUI();
  }

  updateCharacter(dt, worldTime);
  maybeRecenter();
  updateCamera(dt);
  updateSunFollow();
  updateHover();
  if (pointer.stroke && hover.valid) {
    applyBrush(hover.point.x, hover.point.z, pointer.stroke, Math.min(dt, 0.05));
  }
  stepTerrain(dt);
  supportAccumulator += dt;
  if (supportAccumulator >= 0.12) {
    supportAccumulator = 0;
    updateVegetationSupport();
  }
  updateFallingProps(dt);
  waterAccum += dt;
  if (waterAccum >= 1 / 30) {
    updateWater(worldTime);
    waterAccum = 0;
  }
  updateClouds(worldTime);
  updateFireflies(worldTime);
  updateRing(worldTime);

  renderer.render(scene, camera);
}

/* ------------------------------ init ------------------------------ */
function init() {
  resizeView();
  buildCharacter();
  createWater();
  createRing();
  createTerrainMesh();
  setupUI();
  const touchLayout = isTouchPrimary();
  enableTouchUI(touchLayout);
  if (touchLayout) setPanelCollapsed(true, false);
  regenerate(true);
  setOutline(true);
  setCameraMode('follow');
  setAutoTime(false);
  setEditMode(false);
  updateCelestial();
  syncTimeUI(true);
  updateCamera(0, true);
  updateSunFollow();
  updateWater(0);
  updateClouds(0);
  updateRing(0);
  renderer.render(scene, camera);
  ready = true;

  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      loadingEl.classList.add('hide');
      setTimeout(() => { loadingEl.style.display = 'none'; }, 750);
      const tip = document.body.classList.contains('is-touch')
        ? '左侧摇杆移动 · 右侧跳跃 · 雕刻键进入雕塑模式'
        : 'WASD 移动 · 空格跳跃 · E 开启雕塑模式';
      setTimeout(() => toast(tip, 3400), 900);
    });
  });

  animate();
}

try {
  init();
} catch (err) {
  console.error(err);
  loadingEl.classList.remove('hide');
  loadingEl.querySelector('h2').textContent = '沙盘搭建失败';
  loadError.style.display = 'block';
  loadError.textContent = 'WebGL 初始化失败：' + (err && err.message ? err.message : String(err));
}

/* ------------------------------ debug hatch ------------------------------ */
window.__TOON__ = {
  THREE,
  scene,
  camera,
  renderer,
  state,
  char,
  keys,
  heights,
  displayHeights,
  get ready() { return ready; },
  get frames() { return frameCount; },
  get flora() { return floraGroup; },
  get clouds() { return cloudGroup; },
  get water() { return waterMesh; },
  get deepWater() { return deepWaterMesh; },
  get avatar() { return avatar; },
  get terrain() { return terrainMesh; },
  get groundProps() { return groundProps; },
  get fallingProps() { return fallingProps; },
  get removedProps() { return removedProps.size; },
  get patchCenter() { return { x: patchCenterX, z: patchCenterZ }; },
  get editCount() { return edits.size; },
  get gesture() {
    return {
      type: pointer.type, stroke: pointer.stroke, brush: touchBrush,
      touch: pointer.touch, pid: pointer.pid, inside: pointer.inside,
      zoom: +state.zoom.toFixed(3), pinching: !!pinchState, locked: gestureLock,
    };
  },
  get touchStick() { return { x: +touchStick.x.toFixed(3), y: +touchStick.y.toFixed(3), active: touchStick.active }; },
  get info() {
    let min = Infinity, max = -Infinity;
    for (let i = 0; i < heights.length; i++) {
      if (heights[i] < min) min = heights[i];
      if (heights[i] > max) max = heights[i];
    }
    return {
      ready,
      seed: state.seed,
      fps: Math.round(fpsAvg),
      calls: renderer.info.render.calls,
      triangles: renderer.info.render.triangles,
      heightMin: +min.toFixed(2),
      heightMax: +max.toFixed(2),
      vertexCount: terrainGeo ? terrainGeo.attributes.position.count : 0,
      outline: state.outline,
      editMode: state.editMode,
      worldMode: state.worldMode,
      islandSize: state.islandSize,
      patchCenter: [+patchCenterX.toFixed(2), +patchCenterZ.toFixed(2)],
      edits: edits.size,
      falling: fallingProps.length,
      removed: removedProps.size,
      time: +state.time.toFixed(2),
      char: { x: +char.pos.x.toFixed(2), y: +char.pos.y.toFixed(2), z: +char.pos.z.toFixed(2) },
    };
  },
  sampleHeight(x, z) { return sampleHeight(displayHeights, x, z); },
  setTime(t) { state.time = clamp(t, 0, 24); updateCelestial(); syncTimeUI(true); },
  setEditMode,
  setTouchBrush,
  setOutline,
  setCameraMode,
  setAutoTime,
  setIslandSize,
  setWorldMode,
  setPanelCollapsed,
  enableTouchUI,
  forceRecenter() { maybeRecenter(); },
  reseedTo(seed) {
    state.seed = Number(seed) >>> 0;
    regenerate(false);
  },
  raiseAt(x, z, amount = 0.7) {
    applyBrush(x, z, 1, amount);
    stepTerrain(0.016);
  },
  lowerAt(x, z, amount = 0.7) {
    applyBrush(x, z, -1, amount);
    stepTerrain(0.016);
  },
  clickWorld(x, z) {
    return { x, z, height: sampleHeight(displayHeights, x, z) };
  },
  advance(seconds = 1) {
    const steps = Math.max(1, Math.round(seconds * 60));
    const dt = 1 / 60;
    for (let i = 0; i < steps; i++) {
      stepTerrain(dt);
      updateVegetationSupport();
      updateFallingProps(dt);
    }
    rebuildTerrainNow(true);
    updateFloraMatrices();
    return { falling: fallingProps.length, removed: removedProps.size };
  },
};
</script>
